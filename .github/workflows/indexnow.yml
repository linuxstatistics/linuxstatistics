# Tell IndexNow engines (Bing, Yandex, Seznam, Naver) about our URLs once a day,
# after the daily ingest (02:15 UTC) has rebuilt the site. Google doesn't take
# part; it reads the sitemap. Vercel creates no GitHub deployments here, so a
# deployment_status trigger would never fire; a schedule is the dependable hook.
name: indexnow

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install
        run: npx --yes pnpm@12.14.0 install --frozen-lockfile

      # The key is public by design (served at /<key>.txt), so no secret is needed.
      - name: Submit sitemap URLs
        env:
          SITE_URL: https://linuxstatistics.com
        run: npx --yes pnpm@12.14.0 --filter @linux-statistics/worker indexnow
